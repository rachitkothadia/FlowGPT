name: Windows app and installer
on:
  push:
    branches: [main, 'codex/windows-*']
    paths: ['Windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Portable policy tests
        run: |
          cmake -S Windows -B Windows/test-build
          cmake --build Windows/test-build --config Release
          ctest --test-dir Windows/test-build -C Release --output-on-failure
      - name: Build native WinUI app
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" Windows/FlowGPT.vcxproj /restore /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $crtFolder = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory -Recurse | Where-Object FullName -match '\\x64\\Microsoft\.VC\d+\.CRT$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crtFolder) { throw 'Native x64 CRT redistributable not found' }
          Copy-Item "$($crtFolder.FullName)\*.dll" Windows/out/x64/Release/
      - name: Prepare verified WebView2 Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile Windows/Installer/WebView2Bootstrapper.exe
          $signature = Get-AuthenticodeSignature Windows/Installer/WebView2Bootstrapper.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'WebView2 redistributable signature invalid' }
          $p = Start-Process Windows/Installer/WebView2Bootstrapper.exe -ArgumentList '/silent /install' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'WebView2 runtime setup timeout' }
          if ($p.ExitCode -ne 0) { throw "WebView2 runtime setup failed: $($p.ExitCode)" }
      - name: Verify actual Windows application and browser fixtures
        shell: pwsh
        run: |
          $app = (Resolve-Path Windows/out/x64/Release/FlowGPT.exe).Path
          $p = Start-Process $app -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native fixture timeout' }
          Get-Content Windows/out/x64/Release/native-tests.json
          $nativePassed = $p.ExitCode -eq 0
          Add-Type -AssemblyName System.Drawing
          Add-Type 'using System; using System.Runtime.InteropServices; public static class FlowCapture { [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left,Top,Right,Bottom; } [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out Rect r); [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string title); }'
          $p = Start-Process $app -ArgumentList '--ui-smoke' -PassThru
          Start-Sleep -Seconds 4
          $p.Refresh()
          $rect = New-Object FlowCapture+Rect
          $mainWindow = [FlowCapture]::FindWindow($null,'FlowGPT')
          if ($mainWindow -ne 0 -and [FlowCapture]::GetWindowRect($mainWindow,[ref]$rect)) {
            $bitmap = New-Object System.Drawing.Bitmap ($rect.Right-$rect.Left),($rect.Bottom-$rect.Top)
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($rect.Left,$rect.Top,0,0,$bitmap.Size)
            $bitmap.Save((Join-Path (Resolve-Path Windows/out/x64/Release).Path 'ui-preview.png'))
            $graphics.Dispose(); $bitmap.Dispose()
          }
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'WinUI lifecycle timeout' }
          if (-not (Test-Path Windows/out/x64/Release/ui-smoke.json)) {
            Get-Content Windows/out/x64/Release/ui-stage.txt -ErrorAction SilentlyContinue
            Get-Content Windows/out/x64/Release/ui-startup-error.txt -ErrorAction SilentlyContinue
            throw "WinUI app exited without its lifecycle report: $($p.ExitCode)"
          }
          $report = Get-Content Windows/out/x64/Release/ui-smoke.json | ConvertFrom-Json
          Get-Content Windows/out/x64/Release/ui-smoke.json
          if (-not $report.passed) { throw 'WinUI lifecycle fixture failed' }
          if (-not $nativePassed) { throw 'Native fixtures failed; UI lifecycle was checked separately' }
      - name: Build EXE installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Windows/Installer/FlowGPT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-ChildItem release/windows/*Setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/windows/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Verify installed payload and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/windows/*Setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'FlowGPT-installed-fixture'
          $checks = [ordered]@{}
          $dataDirectory = Join-Path $env:LOCALAPPDATA 'FlowGPT'
          New-Item $dataDirectory -ItemType Directory -Force | Out-Null
          $marker = Join-Path $dataDirectory 'disposable-installer-fixture.txt'
          'Preserve this fixture during upgrade and uninstall' | Set-Content $marker
          $p = Start-Process $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=startup /DIR=`"$destination`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Installer timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$destination/FlowGPT.exe")) { throw 'Installation failed' }
          $checks.installSucceeded = $true
          $original = (Get-FileHash Windows/out/x64/Release/FlowGPT.exe).Hash
          if ((Get-FileHash "$destination/FlowGPT.exe").Hash -ne $original) { throw 'Installed executable differs' }
          $checks.installedExecutableMatches = $true
          if (Test-Path "$destination/native-tests.json") { throw 'Developer test reports were bundled in the installed app' }
          $checks.developerReportsExcluded = $true
          $startupCommand = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').FlowGPT
          if ($startupCommand -ne "`"$destination\FlowGPT.exe`" --background") { throw 'Login startup command was not registered correctly' }
          $checks.loginStartupRegistered = $true
          $p = Start-Process "$destination/FlowGPT.exe" -ArgumentList '--background --ui-smoke' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Installed WinUI app timeout' }
          $report = Get-Content "$destination/ui-smoke.json" | ConvertFrom-Json
          if (-not $report.passed) { throw 'Installed application lifecycle failed' }
          $checks.installedBackgroundLifecyclePassed = $true
          $p = Start-Process $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=startup /DIR=`"$destination`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Upgrade timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $marker)) { throw 'Upgrade did not preserve user data' }
          $checks.upgradePreservesUserData = $true
          $p = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Uninstaller timeout' }
          if (Test-Path "$destination/FlowGPT.exe") { throw 'Installed app not removed' }
          $checks.uninstallRemovesApplication = $true
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).FlowGPT) { throw 'Uninstall did not remove login startup' }
          $checks.uninstallRemovesStartup = $true
          if (-not (Test-Path $marker)) { throw 'Silent uninstall unexpectedly removed saved data' }
          $checks.uninstallKeepsUserDataByDefault = $true
          Remove-Item $marker
          @{ passed=$true; checks=$checks } | ConvertTo-Json -Depth 5 | Set-Content release/windows/installer-tests.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FlowGPT-Windows-x64
          path: |
            release/windows/
            Windows/out/x64/Release/
          if-no-files-found: warn
