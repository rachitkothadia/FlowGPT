name: Windows app and installer
on:
  push:
    branches: [main, 'codex/windows-*']
    paths: ['Windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Portable policy tests
        run: |
          cmake -S Windows -B Windows/test-build
          cmake --build Windows/test-build --config Release
          ctest --test-dir Windows/test-build -C Release --output-on-failure
      - name: Build native WinUI app
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "$vs\MSBuild\Current\Bin\MSBuild.exe" Windows/FlowGPT.vcxproj /restore /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $crtFolder = Get-ChildItem "$($crt.FullName)\x64" -Directory | Where-Object Name -like 'Microsoft.VC*.CRT' | Sort-Object Name -Descending | Select-Object -First 1
          Copy-Item "$($crtFolder.FullName)\*.dll" Windows/out/x64/Release/
      - name: Prepare verified WebView2 Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile Windows/Installer/WebView2Bootstrapper.exe
          $signature = Get-AuthenticodeSignature Windows/Installer/WebView2Bootstrapper.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'WebView2 redistributable signature invalid' }
          $p = Start-Process Windows/Installer/WebView2Bootstrapper.exe -ArgumentList '/silent /install' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'WebView2 runtime setup timeout' }
          if ($p.ExitCode -ne 0) { throw "WebView2 runtime setup failed: $($p.ExitCode)" }
      - name: Verify actual Windows application and browser fixtures
        shell: pwsh
        run: |
          $app = (Resolve-Path Windows/out/x64/Release/FlowGPT.exe).Path
          $p = Start-Process $app -ArgumentList '--self-test' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Native fixture timeout' }
          if ($p.ExitCode -ne 0) { Get-Content Windows/out/x64/Release/native-tests.json -ErrorAction SilentlyContinue; throw 'Native fixtures failed' }
          Get-Content Windows/out/x64/Release/native-tests.json
          $p = Start-Process $app -ArgumentList '--ui-smoke' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'WinUI lifecycle timeout' }
          $report = Get-Content Windows/out/x64/Release/ui-smoke.json | ConvertFrom-Json
          if (-not $report.passed) { throw 'WinUI lifecycle fixture failed' }
      - name: Build EXE installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" Windows/Installer/FlowGPT.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash release/windows/*.exe -Algorithm SHA256 | Format-List | Out-File release/windows/SHA256SUMS.txt
      - name: Verify installed payload and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/windows/*Setup.exe | Select-Object -First 1
          $destination = Join-Path $env:RUNNER_TEMP 'FlowGPT-installed-fixture'
          $p = Start-Process $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$destination`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Installer timeout' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$destination/FlowGPT.exe")) { throw 'Installation failed' }
          $original = (Get-FileHash Windows/out/x64/Release/FlowGPT.exe).Hash
          if ((Get-FileHash "$destination/FlowGPT.exe").Hash -ne $original) { throw 'Installed executable differs' }
          $p = Start-Process "$destination/FlowGPT.exe" -ArgumentList '--ui-smoke' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Installed WinUI app timeout' }
          $report = Get-Content "$destination/ui-smoke.json" | ConvertFrom-Json
          if (-not $report.passed) { throw 'Installed application lifecycle failed' }
          $p = Start-Process "$destination/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'Uninstaller timeout' }
          if (Test-Path "$destination/FlowGPT.exe") { throw 'Installed app not removed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: FlowGPT-Windows-x64
          path: |
            release/windows/
            Windows/out/x64/Release/
          if-no-files-found: warn
